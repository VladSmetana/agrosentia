<section class="section-your-order" id="customer-order">
  <div class="container your-order-container">
    <div class="your-order-panel panel">
      <div class="your-order-copy">
        <p class="section-kicker">Request form</p>
        <h2 class="your-order-title">
          <span>Leave a request</span>
        </h2>
        <p class="your-order-text">
          Share the product mix, target volume, and destination. We will come
          back with a tailored export offer.
        </p>
      </div>

      <form class="your-order-form" action="mailto:smetana@onua.edu.ua" method="post" enctype="text/plain">
        <label class="field">
          <span class="visually-hidden">Full name</span>
          <input
            class="field-input"
            type="text"
            name="full-name"
            placeholder="Enter your full name"
            required
          />
        </label>

        <label class="field">
          <span class="visually-hidden">Email</span>
          <input
            class="field-input"
            type="email"
            name="email"
            placeholder="Enter your email"
            required
          />
        </label>

        <label class="field field--textarea">
          <span class="visually-hidden">Comments</span>
          <textarea
            class="field-input field-input--textarea"
            name="comments"
            id="comments"
            placeholder="Comments"
            cols="30"
            rows="10"
            required
          ></textarea>
        </label>

        <button class="button button--primary your-order-button" type="submit">
          Send
          <svg class="button-icon" width="22" height="18" aria-hidden="true">
            <use href="./img/sprite.svg#icon-pointer"></use>
          </svg>
        </button>
      </form>
    </div>

    <div class="your-order-left">
      <img class="your-order-img" src="./logo.svg" alt="Agrosentia logo" />
      <div class="your-order-text your-order-brand-text">
        <h2 class="your-order-company">Agrosentia</h2>
        <p class="your-order-tagline">
          Harvested in Ukraine.<br />
          Trusted worldwide.
        </p>
      </div>
    </div>
  </div>
</section>
